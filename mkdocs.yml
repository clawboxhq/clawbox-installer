site_name: ClawBox
site_description: Run AI Locally. Execute Code Safely.
site_url: https://clawboxhq.github.io/clawbox-installer/
repo_url: https://github.com/clawboxhq/clawbox-installer
repo_name: clawboxhq/clawbox-installer
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/clawboxhq/clawbox-installer
    - icon: fontawesome/brands/discord
      link: https://discord.gg/XFpfP9vUvx

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: QUICKSTART.md
  - Download: download.md
  - FAQ: FAQ.md
  - Security: SECURITY.md
  - Architecture: ARCHITECTURE.md
  - Blog:
    - Why AI-Generated Code Needs a Sandbox: blog/why-ai-generated-code-needs-a-sandbox.md
  - Community: discord-server-structure.md
  - Launch Checklist: launch-checklist.md
  - Demo Video Script: demo-video-script.md
